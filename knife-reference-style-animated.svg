<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 110" role="img" aria-label="Knife slicing meat with the sharp lower edge">
  <title>Knife slicing meat with the sharp lower edge</title>
  <defs>
    <linearGradient id="steak" x1=".1" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#ff637d"/>
      <stop offset=".45" stop-color="#d82951"/>
      <stop offset="1" stop-color="#87132f"/>
    </linearGradient>
    <linearGradient id="bladeFill" x1="0" y1="0" x2=".8" y2="1">
      <stop offset="0" stop-color="#3d1928"/>
      <stop offset=".55" stop-color="#5a2334"/>
      <stop offset="1" stop-color="#28111c"/>
    </linearGradient>
    <filter id="halo" x="-45%" y="-45%" width="190%" height="190%">
      <feGaussianBlur stdDeviation="2.4"/>
    </filter>
  </defs>
  <style>
    .knife-motion{animation:knifeSlice 1.9s cubic-bezier(.54,.05,.43,.96) infinite}
    .steak-motion{transform-origin:58px 93px;animation:steakPress 1.9s ease-in-out infinite}
    .slice-motion{animation:sliceShift 1.9s ease-in-out infinite}
    .slice-sparks{opacity:0;animation:sparks 1.9s linear infinite}
    @keyframes knifeSlice{
      0%,10%,100%{transform:translate(0,-15px) rotate(-2deg)}
      40%,54%{transform:translate(0,10px) rotate(0deg)}
      72%{transform:translate(0,-7px) rotate(-1deg)}
    }
    @keyframes steakPress{0%,30%,72%,100%{transform:scaleY(1)}42%,56%{transform:scaleY(.95)}}
    @keyframes sliceShift{0%,31%,100%{transform:translateX(0)}45%,68%{transform:translateX(4px)}}
    @keyframes sparks{0%,34%,60%,100%{opacity:0}40%,53%{opacity:1}}
    @media(prefers-reduced-motion:reduce){.knife-motion,.steak-motion,.slice-motion,.slice-sparks{animation:none!important}.knife-motion{transform:translate(0,8px)}}
  </style>
  <path d="M9 104H120" stroke="#f2d3a1" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
  <g class="steak-motion">
    <path d="M16 85Q19 72 39 73Q61 69 81 76Q95 80 96 89Q95 100 77 100H34Q18 99 16 89Z" fill="url(#steak)" stroke="#ffe2de" stroke-width="2.8" stroke-linejoin="round"/>
    <path d="M32 84Q49 77 68 83 M41 92Q55 89 71 91" stroke="#ffa4b3" stroke-width="2.4" fill="none" stroke-linecap="round"/>
  </g>
  <g class="slice-motion">
    <path d="M96 81Q108 79 114 86Q119 97 108 100L97 99Z" fill="#cb2847" stroke="#ffe3df" stroke-width="2.6"/>
    <path d="M108 87L106 95" stroke="#ffabb5" stroke-width="2.2" stroke-linecap="round"/>
  </g>
  <!-- Knife: handle upper-right, tip left. The SHARP CUTTING EDGE is the LOWER bright curved line touching the steak. -->
  <g class="knife-motion">
    <path d="M21 72Q34 46 81 31L92 43Q62 66 21 72Z" fill="none" stroke="#ff8397" stroke-width="6" opacity=".65" filter="url(#halo)"/>
    <path d="M86 34L108 14Q114 9 119 15L122 18Q125 22 121 26L98 47Z" fill="#321521" stroke="#fff3f2" stroke-width="3.4" stroke-linejoin="round"/>
    <path d="M91 35L103 45" stroke="#fff2ef" stroke-width="3.2" stroke-linecap="round"/>
    <circle cx="109" cy="23" r="2.2" fill="#fff4f3"/>
    <circle cx="116" cy="18" r="2.2" fill="#fff4f3"/>
    <circle cx="102" cy="29" r="2.2" fill="#fff4f3"/>
    <path d="M21 72Q34 46 81 31L92 43Q62 66 21 72Z" fill="url(#bladeFill)" stroke="#fff6f5" stroke-width="3.1" stroke-linejoin="round"/>
    <path d="M23 70Q36 47 81 32" fill="none" stroke="#b8adb4" stroke-width="2.1" stroke-linecap="round" opacity=".7"/>
    <path d="M21 72Q62 66 92 43" fill="none" stroke="#ffffff" stroke-width="4.2" stroke-linecap="round"/>
    <path d="M26 70Q64 64 89 44" fill="none" stroke="#ffdfe5" stroke-width="1.8" stroke-linecap="round" opacity=".95"/>
    <path d="M81 31L92 43" fill="none" stroke="#fff8f5" stroke-width="2.6"/>
  </g>
  <g class="slice-sparks" fill="none" stroke="#ffe3c7" stroke-width="2.4" stroke-linecap="round">
    <path d="M22 72L14 69 M22 78L14 81 M27 68L25 62"/>
  </g>
</svg>