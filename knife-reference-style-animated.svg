<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 110" role="img" aria-label="Terav lihanuga lõikab liha">
<title>Nuga lõikab liha terava servaga</title>
<defs>
  <linearGradient id="steak" x1=".1" y1="0" x2=".9" y2="1">
    <stop offset="0" stop-color="#ff637d"/><stop offset=".45" stop-color="#d82951"/><stop offset="1" stop-color="#87132f"/>
  </linearGradient>
  <linearGradient id="blade" x1="0" y1="0" x2=".75" y2="1">
    <stop offset="0" stop-color="#3f1b2c"/><stop offset=".6" stop-color="#642738"/><stop offset="1" stop-color="#28111e"/>
  </linearGradient>
  <filter id="halo" x="-45%" y="-45%" width="190%" height="190%"><feGaussianBlur stdDeviation="2.7"/></filter>
</defs>
<style>
  .blade-motion{animation:butcherSlice 1.9s cubic-bezier(.54,.05,.43,.96) infinite}
  .steak-motion{transform-origin:58px 93px;animation:steakPress 1.9s ease-in-out infinite}
  .slice-motion{animation:sliceShift 1.9s ease-in-out infinite}
  .slice-sparks{opacity:0;animation:sparks 1.9s linear infinite}
  @keyframes butcherSlice{
    0%,9%,100%{transform:translate(0,-15px) rotate(-2deg)}
    40%,54%{transform:translate(0,10px) rotate(0deg)}
    72%{transform:translate(0,-7px) rotate(-1deg)}
  }
  @keyframes steakPress{0%,30%,72%,100%{transform:scaleY(1)}42%,56%{transform:scaleY(.95)}}
  @keyframes sliceShift{0%,31%,100%{transform:translateX(0)}45%,68%{transform:translateX(4px)}}
  @keyframes sparks{0%,34%,60%,100%{opacity:0}40%,53%{opacity:1}}
  @media(prefers-reduced-motion:reduce){.blade-motion,.steak-motion,.slice-motion,.slice-sparks{animation:none!important}.blade-motion{transform:translate(0,8px)}}
</style>
<!-- Steak and chopping board -->
<path d="M9 104H120" stroke="#f2d3a1" stroke-width="3.2" stroke-linecap="round" opacity=".85"/>
<g class="steak-motion">
  <path d="M16 85Q19 72 39 73Q61 69 81 76Q95 80 96 89Q95 100 77 100H34Q18 99 16 89Z" fill="url(#steak)" stroke="#ffe2de" stroke-width="2.8" stroke-linejoin="round"/>
  <path d="M32 84Q49 77 68 83 M41 92Q55 89 71 91" stroke="#ffa4b3" stroke-width="2.4" fill="none" stroke-linecap="round"/>
</g>
<g class="slice-motion">
  <path d="M96 81Q108 79 114 86Q119 97 108 100L97 99Z" fill="#cb2847" stroke="#ffe3df" stroke-width="2.6"/>
  <path d="M108 87L106 95" stroke="#ffabb5" stroke-width="2.2" stroke-linecap="round"/>
</g>
<!-- Knife outline based on the crossed-knives reference: slender pointed blade, three rivets.
     Sharp LOWER belly is the glowing line from the point to the bolster. -->
<g class="blade-motion">
  <!-- glow of the blade, to make it recognizable at small favicon-like sizes -->
  <path d="M22 73 Q32 49 82 31 L92 43 Q61 65 22 73Z" fill="none" stroke="#ff8397" stroke-width="6" opacity=".67" filter="url(#halo)"/>
  <!-- handle, upper right, with three rivets -->
  <path d="M86 34L108 14Q114 9 119 15L122 18Q125 22 121 26L98 47Z" fill="#321521" stroke="#fff3f2" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M91 35L103 45" stroke="#fff2ef" stroke-width="3.4" stroke-linecap="round"/>
  <circle cx="109" cy="23" r="2.2" fill="#fff4f3"/>
  <circle cx="116" cy="18" r="2.2" fill="#fff4f3"/>
  <circle cx="102" cy="29" r="2.2" fill="#fff4f3"/>
  <!-- pointed curved butcher knife, dark interior + thin vivid rim like reference -->
  <path d="M22 73Q34 47 82 31L92 43Q61 65 22 73Z" fill="url(#blade)" stroke="#fff6f5" stroke-width="3.4" stroke-linejoin="round"/>
  <!-- spine above; lower curved edge is cutting edge touching steak -->
  <path d="M22 73Q61 65 92 43" fill="none" stroke="#fffefe" stroke-width="3.8" stroke-linecap="round"/>
  <path d="M36 62Q52 45 78 38" fill="none" stroke="#bdb1b7" stroke-width="1.7" stroke-linecap="round" opacity=".72"/>
  <path d="M82 31L92 43" fill="none" stroke="#fff8f5" stroke-width="2.6"/>
</g>
<!-- small sparks timed to the contact -->
<g class="slice-sparks" fill="none" stroke="#ffe3c7" stroke-width="2.4" stroke-linecap="round">
  <path d="M22 72L14 69 M22 78L14 81 M27 68L25 62"/>
</g>
</svg>