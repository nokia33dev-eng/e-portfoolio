  .hygiene-page, .hygiene-page * { box-sizing: border-box; }
  .hygiene-page {
    width: 100%;
    max-width: 1100px;
    margin: 28px auto;
    padding: 0 16px;
    overflow-x: hidden;
    color: #444450;
    font-family: 'Segoe UI', Arial, sans-serif;
  }
  .hygiene-page .hygiene-hero {
    position: relative;
    margin: 0 4px 22px;
    padding: 18px 22px 20px;
    overflow: hidden;
    border: 1px solid rgba(112,157,86,.18);
    border-radius: 16px;
    background: linear-gradient(110deg, rgba(255,255,255,.72), rgba(233,242,222,.72), rgba(255,255,255,.72));
    box-shadow: 0 8px 24px rgba(79,111,62,.08);
    animation: hero-arrive .7s ease both;
  }
  .hygiene-page .hero-kicker { display: inline-block; color: #64894f; font-size: 11px; font-weight: 700; letter-spacing: 2.4px; }
  .hygiene-page .intro { margin: 7px 0 8px; color: #30372d; font-size: clamp(22px, 3vw, 30px); font-weight: 700; letter-spacing: .2px; line-height: 1.25; }
  .hygiene-page .hero-note { margin: 8px 0 0; color: #5b6257; font-size: 15px; line-height: 1.6; }
  .hygiene-page .hero-rule { display: block; width: 92px; height: 5px; border-radius: 9px; background: linear-gradient(90deg,#93bd75,#6b9b4b,#b2d392); background-size: 200% 100%; box-shadow: 0 2px 8px rgba(107,155,75,.25); animation: hero-glow 4s ease-in-out infinite alternate; }
  @keyframes hero-arrive { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes hero-glow { to { background-position: 100% 50%; box-shadow: 0 2px 13px rgba(107,155,75,.42); } }
  .hygiene-page .accordion-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px; align-items: start; }
  .hygiene-page .accordion {
    width: 100%;
    min-width: 0;
    margin: 18px 0;
    overflow: hidden;
    border-radius: 16px;
    background: linear-gradient(135deg, rgba(250,250,252,.96), rgba(240,240,245,.96));
    box-shadow: 0 12px 35px rgba(40,40,60,.15), 0 3px 10px rgba(40,40,60,.08), inset 0 1px 0 rgba(255,255,255,.9);
    transition: box-shadow .35s ease;
  }
  .hygiene-page .accordion:hover,
  .hygiene-page .accordion.open {
    box-shadow: 0 16px 42px rgba(40,40,60,.22), 0 5px 14px rgba(40,40,60,.11), inset 0 1px 0 rgba(255,255,255,.9);
  }
  .hygiene-page .accordion-header {
    display: flex;
    width: 100%;
    align-items: center;
    justify-content: space-between;
    gap: 15px;
    padding: 20px 26px;
    border: 0;
    background: transparent;
    color: #2a2a35;
    cursor: pointer;
    font: inherit;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 1.2px;
    text-align: left;
  }
  .hygiene-page .accordion-header:hover,
  .hygiene-page .accordion-header:focus-visible {
    background: linear-gradient(90deg, rgba(200,200,215,.35), rgba(230,230,240,.15));
    outline: 2px solid #77778b;
    outline-offset: -3px;
  }
  .hygiene-page .header-text {
    flex: 1;
    background: linear-gradient(90deg, #2a2a35, #6b6b80, #a0a0b0, #6b6b80, #2a2a35);
    background-size: 300% 100%;
    background-clip: text;
    -webkit-background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: hygiene-gradient 7s linear infinite;
    filter: drop-shadow(0 2px 4px rgba(60,60,80,.2));
  }
  @keyframes hygiene-gradient {
    to { background-position: 300% 50%; }
  }
  .hygiene-page .header-arrow {
    color: #6b6b80;
    font-size: 28px;
    font-weight: 400;
    line-height: 1;
    transition: transform .35s ease, color .35s ease;
  }
  .hygiene-page .accordion.open .header-arrow {
    transform: rotate(90deg);
    color: #2a2a35;
  }
  .hygiene-page .accordion-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height .55s cubic-bezier(.22,1,.36,1);
  }
  .hygiene-page .accordion.open .accordion-body {
    max-height: 1600px;
  }
  .hygiene-page .accordion-inner {
    padding: 0 26px 26px;
    opacity: 0;
    transform: translateY(-10px);
    transition: opacity .35s ease, transform .35s ease;
  }
  .hygiene-page .accordion.open .accordion-inner {
    opacity: 1;
    transform: translateY(0);
  }
  .hygiene-page .content-row {
    display: flex;
    align-items: flex-start;
    gap: 14px;
  }
  .hygiene-page .line {
    min-width: 0;
    position: relative;
    flex: 1 1 auto;
    margin: 0;
    padding-left: 20px;
    color: #444450;
    font-size: 16px;
    line-height: 1.8;
  }
  .hygiene-page .line::before {
    position: absolute;
    top: 9px;
    left: 2px;
    width: 6px;
    height: 6px;
    background: linear-gradient(135deg, #a0a0b0, #2a2a35);
    box-shadow: 0 0 6px rgba(60,60,80,.35);
    content: '';
    transform: rotate(45deg);
  }
  .hygiene-page .photo-block {
    position: relative;
    flex: 0 0 160px;
    overflow: hidden;
    width: 160px;
    padding: 5px;
    border-radius: 14px;
    background: linear-gradient(135deg, #2a2a35, #6b6b80, #d8d8e0, #6b6b80, #2a2a35);
    background-size: 300% 300%;
    box-shadow: 0 12px 30px rgba(40,40,60,.28);
    animation: hygiene-frame 8s linear infinite;
    transition: transform .35s ease, box-shadow .35s ease;
  }
  @keyframes hygiene-frame {
    to { background-position: 300% 50%; }
  }
  .hygiene-page .photo-block:hover {
    transform: translateY(-3px) scale(1.02);
    box-shadow: 0 18px 42px rgba(40,40,60,.38);
  }
  .hygiene-page .photo-block img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 10px;
  }
  .hygiene-page .photo-shine {
    position: absolute;
    inset: 0;
    overflow: hidden;
    border-radius: 14px;
    pointer-events: none;
  }
  .hygiene-page .photo-shine::before {
    position: absolute;
    top: -60%;
    left: -80%;
    width: 45%;
    height: 220%;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.65) 50%, transparent 70%);
    content: '';
    transform: rotate(20deg);
    animation: hygiene-shine 6s ease-in-out infinite 2s;
  }
  @keyframes hygiene-shine {
    0%, 100% { left: -80%; opacity: 0; }
    10% { opacity: 1; }
    35% { left: 130%; opacity: 0; }
  }
  .hygiene-page .no-photo {
    display: grid;
    grid-template-columns: minmax(0, 1.35fr) minmax(0, .85fr);
    gap: 12px;
    align-items: start;
  }
  .hygiene-page .hygiene-list {
    margin: 0 0 16px;
    padding-left: 24px;
    font-size: 15px;
    line-height: 1.65;
  }
  .hygiene-page .hygiene-list li {
    margin: 0 0 8px;
  }
  .hygiene-page .reflection {
    margin-top: 8px;
  }
  @media (max-width: 640px) {
    .hygiene-page .accordion-grid { grid-template-columns: 1fr; }
    .hygiene-page .no-photo { grid-template-columns: 1fr; }
    .hygiene-page .accordion-header {
      padding: 18px 20px;
      font-size: 18px;
      letter-spacing: .7px;
    }
    .hygiene-page .accordion-inner {
      padding: 0 20px 22px;
    }
    .hygiene-page .content-row {
      flex-direction: column;
      align-items: stretch;
    }
    .hygiene-page .photo-block {
      order: -1;
      align-self: center;
      flex: 0 1 auto;
      width: 100%;
      max-width: 320px;
    }
  }
  @media (prefers-reduced-motion: reduce) {
    .hygiene-page *,
    .hygiene-page *::before,
    .hygiene-page *::after {
      animation-duration: .01ms !important;
      animation-iteration-count: 1 !important;
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
    }
  }

.hygiene-page{color:#eee;margin:10px auto 35px}.hygiene-page .hygiene-hero{background:linear-gradient(115deg,#261a1e,#18171c);border-color:#76313b;box-shadow:0 10px 35px #0008}.hygiene-page .hero-kicker{color:#ff8990}.hygiene-page .intro{color:#fff}.hygiene-page .hero-note{color:#c9bdc0}.hygiene-page .hero-rule{background:linear-gradient(90deg,#8f202e,#ff5361,#ffa0a5);box-shadow:0 0 15px #f0444e88}.hygiene-page .accordion{background:linear-gradient(135deg,#282026,#17171c);border:1px solid #66313a;box-shadow:0 12px 35px #0008}.hygiene-page .accordion:hover,.hygiene-page .accordion.open{box-shadow:0 16px 42px #000a,0 0 22px #e83d4d33}.hygiene-page .accordion-header{color:#fff}.hygiene-page .accordion-header:hover,.hygiene-page .accordion-header:focus-visible{background:#50212b;outline-color:#ef5a66}.hygiene-page .header-text{background:linear-gradient(90deg,#fff,#ff8790,#fff);background-size:300% 100%;background-clip:text;-webkit-background-clip:text}.hygiene-page .header-arrow,.hygiene-page .accordion.open .header-arrow{color:#ff6672}.hygiene-page .line,.hygiene-page .hygiene-list{color:#e5dce0}.hygiene-page .line::before{background:#f0444e}.hygiene-page .photo-block{background:linear-gradient(135deg,#3b1820,#ef5461,#ffb3b9,#3b1820)}.hygiene-page .no-photo{display:block}.hygiene-page .accordion-grid{grid-template-columns:repeat(2,minmax(0,1fr))}@media(max-width:850px){.hygiene-page .accordion-grid{grid-template-columns:1fr}.hygiene-page .content-row{flex-direction:column}.hygiene-page .photo-block{flex:0 1 auto;max-width:320px;width:100%}}

.hero:after{content:"";position:absolute;width:min(72vw,760px);height:min(72vw,760px);left:50%;top:45%;transform:translate(-50%,-50%);z-index:-1;border-radius:50%;border:1px solid #ff627f1e;box-shadow:0 0 0 82px #f24b6108,0 0 0 170px #f24b6105,0 0 130px #ff425426;pointer-events:none}
.hero-overline{display:inline-flex;align-items:center;gap:10px;font-size:11px;font-weight:800;letter-spacing:3px;color:#ff9ca9;text-transform:uppercase;border:1px solid #ff506b48;background:#ff3a5410;padding:11px 18px;border-radius:30px;backdrop-filter:blur(10px)}
.hero-overline:before{content:"";width:7px;height:7px;border-radius:50%;background:#ff5a75;box-shadow:0 0 12px #ff5a75}
.hero .hero-sigil{font-size:36px;margin:27px 0 5px;color:#ff7185;text-shadow:0 0 32px #ff425c80}
.hero h1{font-size:clamp(43px,7.5vw,108px);line-height:1.05;letter-spacing:.035em;margin:9px 0 9px;font-weight:900;background:linear-gradient(180deg,#fff,#f7dde4 67%,#f29aaa);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 6px 35px #fa3d5650)}
.hero .rule{height:2px;width:min(260px,50vw);margin:18px auto 23px;background:linear-gradient(90deg,transparent,#ff5672,transparent)}
.hero h2{font-size:clamp(27px,3.5vw,44px);letter-spacing:-.03em;margin:0 0 12px;color:#fff}
.hero .hero-code{letter-spacing:5px;font-weight:700;color:#ff8497;font-size:12px;text-transform:uppercase}
.hero .hero-intro{font-size:clamp(15px,1.7vw,18px);line-height:1.6;max-width:610px;color:#cbbfc6;margin:19px auto 0}
.hero-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:27px}
.hero-actions button{border:1px solid #ff6272;background:linear-gradient(120deg,#ff465e,#bd243d);color:white;border-radius:12px;padding:15px 25px;font-size:13px;font-weight:800;letter-spacing:.7px;cursor:pointer;box-shadow:0 10px 32px #ff375037;transition:transform .2s,box-shadow .2s}
.hero-actions button:hover{transform:translateY(-3px);box-shadow:0 15px 40px #ff37505c}
.hero-actions button.secondary{background:#ffffff0b;border-color:#ffffff3b;box-shadow:none}
.hero-actions button.secondary:hover{background:#ffffff19}
.hero-bottom{margin-top:35px;display:flex;gap:12px 26px;flex-wrap:wrap;justify-content:center;font-size:11px;text-transform:uppercase;letter-spacing:2px;color:#a99da7}
.hero-bottom span:before{content:"✦";color:#fa576e;margin-right:10px}
.features{margin-top:0;gap:20px}
.card{position:relative;overflow:hidden;background:linear-gradient(150deg,#20171f,#111016 82%);border:1px solid #ffffff16;border-radius:19px;padding:30px;box-shadow:0 17px 45px #0005;transition:transform .25s,border-color .25s,box-shadow .25s}
.card:before{content:"";position:absolute;left:0;top:0;width:100%;height:2px;background:linear-gradient(90deg,#ff4f70,transparent 70%);opacity:.85}
.card:hover{transform:translateY(-6px);border-color:#ff6a805e;box-shadow:0 23px 55px #0009,0 0 35px #ff334c13}
.card h3{font-size:20px}.card button,.back{background:#4a1b29;border-color:#b8475d;border-radius:10px;padding:12px 17px;font-weight:700}
.section-title{letter-spacing:-.025em}
@media(max-width:650px){.hero{min-height:580px;padding:72px 15px;margin-left:-20px;margin-right:-20px}.hero h1{font-size:clamp(38px,10.1vw,64px);letter-spacing:.005em}.hero-actions{width:100%}.hero-actions button{flex:1 1 180px}.hero-bottom{letter-spacing:1px;gap:11px}.features{gap:12px}.card{padding:22px}}
@media(prefers-reduced-motion:reduce){.card,.hero-actions button{transition:none}}
</style><link rel="stylesheet" href="./butcher-noir.css?v=20261106-motion-02"></head><body><header><div><strong>⚔ Oleksandr Nadiein</strong><small>LIHAMEISTER · E-Portfoolio</small></div><button class="menu-toggle" id="toggle">☰ Menüü</button></header><div class="layout"><aside id="sidebar"><h3>Leheküljed</h3><nav id="nav"></nav></aside><main id="content"></main></div><script>
const hygieneMarkup="<div class=\"hygiene-page\">\n  <div class=\"hygiene-hero\"><span class=\"hero-kicker\">PUHTUS · HÜGIEEN · OHUTUS</span><p class=\"intro\">Puhas töökoht. Ohutu toit.</p><span class=\"hero-rule\" aria-hidden=\"true\"></span><p class=\"hero-note\">Siin on minu praktiline töö ja toiduohutuse põhimõtted.</p></div>\n\n  <div class=\"accordion-grid\">\n  <section class=\"accordion\">\n    <button class=\"accordion-header\" id=\"hygiene-title-1\" aria-expanded=\"false\" aria-controls=\"hygiene-panel-1\">\n      <span class=\"header-text\">Mustuse proov</span>\n      <span class=\"header-arrow\" aria-hidden=\"true\">›</span>\n    </button>\n    <div class=\"accordion-body\" id=\"hygiene-panel-1\" role=\"region\" aria-labelledby=\"hygiene-title-1\" aria-hidden=\"true\">\n      <div class=\"accordion-inner\">\n        <div class=\"content-row\">\n          <p class=\"line\">Võtsin suure vatitupsu ja niisutasin seda veidi steriilse lahusega. Seejärel pühkisin vatitikuga põhjalikult käte nahka, eriti sõrmede vahelt, et koguda võimalikult palju materjali. Kandsin proovi kapslile ja jaotasin selle siksakiliste liigutustega ühtlaselt. Töötasin hoolikalt, et mitte nahka vigastada ega proovi kõrvalise mustusega saastada.</p>\n          <div class=\"photo-block\">\n            <img src=\"https://i.ibb.co/XZN79sRv/1000003824.jpg\" alt=\"Mustuse proovi võtmise töö\">\n            <div class=\"photo-shine\" aria-hidden=\"true\"></div>\n          </div>\n        </div>\n      </div>\n    </div>\n  </section>\n\n  <section class=\"accordion\">\n    <button class=\"accordion-header\" id=\"hygiene-title-2\" aria-expanded=\"false\" aria-controls=\"hygiene-panel-2\">\n      <span class=\"header-text\">Olulised toiduhügieeni põhimõtted</span>\n      <span class=\"header-arrow\" aria-hidden=\"true\">›</span>\n    </button>\n    <div class=\"accordion-body\" id=\"hygiene-panel-2\" role=\"region\" aria-labelledby=\"hygiene-title-2\" aria-hidden=\"true\">\n      <div class=\"accordion-inner\">\n        <div class=\"content-row no-photo\">\n          <ul class=\"hygiene-list\">\n            <li>Pesen käsi enne töö alustamist, pärast tualeti kasutamist, toore liha käsitsemist ja tööülesande vahetamisel.</li>\n            <li>Kasutan puhast tööriietust ning hoian töövahendid ja tööpinnad puhtad.</li>\n            <li>Hoian toore liha ja valmistoitu lahus, et vältida ristsaastumist.</li>\n            <li>Järgin toidu säilitamisel töökoha juhiseid ja märgistusel olevaid tingimusi.</li>\n            <li>Puhastan tööpinnad ja töövahendid ning kasutan puhastus- ja desinfitseerimisvahendeid juhendi järgi.</li>\n          </ul>\n          <p class=\"line reflection\">Need põhimõtted aitavad hoida töökoha puhtana ja toidu ohutuna.</p>\n        </div>\n      </div>\n    </div>\n  </section>\n  </div>\n\n<section class=\"microscopy\" aria-labelledby=\"microscopy-heading\">\n  <div class=\"micro-intro\"><span class=\"micro-kicker\">PRAKTILINE TÖÖ · MIKROSKOOP</span><h2 id=\"microscopy-heading\">Mikroskoobiga vaadeldud proovid</h2><p>Minu praktilise töö fotod.</p></div>\n  <div class=\"micro-grid\">\n    <figure class=\"micro-card\"><a href=\"https://i.imageupload.app/312966b045286f23359a.jpeg\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Vaata suurelt: Tomatikoor\"><img src=\"https://i.imageupload.app/312966b045286f23359a.jpeg\" alt=\"Tomatikoor mikroskoobi all\" loading=\"lazy\"></a><figcaption>Tomatikoor <span>↗</span></figcaption></figure>\n    <figure class=\"micro-card\"><a href=\"https://i.imageupload.app/d81510db03b779b2dbf2.jpeg\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Vaata suurelt: Pärmseen\"><img src=\"https://i.imageupload.app/d81510db03b779b2dbf2.jpeg\" alt=\"Pärmseen mikroskoobi all\" loading=\"lazy\"></a><figcaption>Pärmseen <span>↗</span></figcaption></figure>\n    <figure class=\"micro-card\"><a href=\"https://i.imageupload.app/e0cd39f469446b6d48bf.jpeg\" target=\"_blank\" rel=\"noopener noreferrer\" aria-label=\"Vaata suurelt: Hallitus\"><img src=\"https://i.imageupload.app/e0cd39f469446b6d48bf.jpeg\" alt=\"Hallitus mikroskoobi all\" loading=\"lazy\"></a><figcaption>Hallitus <span>↗</span></figcaption></figure>\n  </div>\n</section>\n</div>";
const groups=[{title:'Home',items:[]},{title:'Juhendamine',items:[]},{title:'Toiduohutus',items:['Toiduhügieen','Müügietikett','Puhastusõpetus','Kvaliteediõpetuse alused','Pakendiõpetus']},{title:'Õpitee moodul',items:['Õpitee','Tööõigus','Majanduse ja ettevõtluse alused','Projektitöö','Karjääritee']},{title:'Liha tehnoloogia',items:['Lihavalmististe valmistamine','Sültide, tarrendtoodete valmistamine','Praetud ja küpsetatud lihatooted','Vorstide valmistamine','Sinkide valmistamine','Värske liha käitlemine','Lamba tükeldamine']},{title:'Lihatöötlemise praktika',items:['Lihatöötlemise praktika','Praktikaseminar']},{title:'Valikõpingud',items:['Valikõpingud vastavalt õppekavale']}];
const nav=document.getElementById('nav'),content=document.getElementById('content'),sidebar=document.getElementById('sidebar');let current='Home';
function navButton(name,sub=false){const b=document.createElement('button');b.className=(sub?'subbtn':'navbtn')+(current===name?' active':'');b.textContent=(sub?'↳ ':'▸ ')+name;b.onclick=()=>show(name);return b}
function renderNav(){nav.innerHTML='';groups.forEach(g=>{nav.appendChild(navButton(g.title));if(g.items.length){let div=document.createElement('div');div.className='sub';g.items.forEach(i=>div.appendChild(navButton(i,true)));nav.appendChild(div)}})}
const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function home(){return `<section class="hero"><div class="hero-overline">Minu õpiteekond · 2026</div><div class="hero-sigil" aria-hidden="true">✦</div><h1>E-PORTFOOLIO</h1><div class="rule"></div><h2>Oleksandr Nadiein</h2><div class="hero-code">LTO26 &nbsp; / &nbsp; LIHAMEISTER</div><p class="hero-intro">Minu õpingud, praktilised tööd ja areng lihatöötlemise erialal. Tere tulemast minu digitaalsesse portfooliosse!</p><div class="hero-actions"><button data-go="Toiduohutus">Avasta minu töid ↗</button><button class="secondary" data-go="Juhendamine">Tutvu õpiteega →</button></div><div class="hero-bottom"><span>Õpingud</span><span>Praktika</span><span>Oskused</span></div></section><div class="features"><div class="card"><h3>🥩 Lihatöötlemine</h3><p>Liha tehnoloogia ja valmistamine.</p><button data-go="Liha tehnoloogia">Vaata teemasid</button></div><div class="card"><h3>⚔ Tootmine</h3><p>Praktilised tööd ja õpitud oskused.</p><button data-go="Lihatöötlemise praktika">Vaata praktikat</button></div><div class="card"><h3>🛡 Hügieen ja kvaliteet</h3><p>Toiduohutus ja kvaliteediõpetus.</p><button data-go="Toiduohutus">Vaata teemasid</button></div></div><section style="margin-top:45px"><h2 class="section-title">Minust</h2>${about()}</section>`}
function about(){return `<div class="about personal-about"><div class="photo-side"><div class="photo-stage"><div class="photo-frame"><div class="photo-depth"><img class="personal-photo" src="https://i.ibb.co/2YjqVZWB/photo-5846144385232342910-x.jpg" alt="Oleksander Nadiein"><div class="photo-vignette"></div></div></div><div class="photo-shadow"></div><div class="paws" aria-hidden="true"><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span><span>🐾</span></div></div></div><div class="text-side"><h2 class="personal-title">Oleksander Nadiein</h2><div class="personal-divider">🐾 <span></span> 🐾</div><div class="personal-lines"><p>Minu nimi on Oleksander Nadiein.</p><p>Minu sünnipäev on 30. märtsil.</p><p>Ma elan Tartus.</p><p>Praegu õpin Lihameistre koolis.</p><p>Varem õppisin Torma koolis.</p><p>Vabal ajal meeldib mulle sõpradega aega veeta, muusikat kuulata ja uusi asju proovida.</p><p>Olen sõbralik ja uudishimulik inimene.</p></div></div></div>`}

function show(name){current=name;renderNav();sidebar.classList.remove('open');if(name==='Home'){content.innerHTML=home();}else if(name==='Toiduhügieen'){content.innerHTML=`<div class="crumb">E-PORTFOOLIO / Toiduohutus / Toiduhügieen</div><h1 class="section-title">Toiduhügieen</h1>`+hygieneMarkup+`<p style="margin-top:28px"><button class="back" data-go="Toiduohutus">← Toiduohutus</button></p>`;content.querySelectorAll('.hygiene-page .accordion').forEach(a=>{const b=a.querySelector('.accordion-header'),panel=a.querySelector('.accordion-body');b.addEventListener('click',()=>{const opened=a.classList.toggle('open');b.setAttribute('aria-expanded',String(opened));panel.setAttribute('aria-hidden',String(!opened));});});}else{const group=groups.find(g=>g.title===name);const parent=groups.find(g=>g.items.includes(name));const items=group?.items||[];content.innerHTML=`<div class="crumb">E-PORTFOOLIO / ${parent?esc(parent.title)+' / ':''}${esc(name)}</div><h1 class="section-title">${esc(name)}</h1><p class="lead">${items.length?'Vali teema, et avada selle lehekülg.':'Siia saad lisada oma õppematerjalid, fotod, ülesanded ja praktilised tööd.'}</p>${items.length?`<div class="cards">${items.map(i=>`<div class="card"><h3>${esc(i)}</h3><p>Õppematerjalid ja tehtud tööd.</p><button data-go="${esc(i)}">Ava teema</button></div>`).join('')}</div>`:`<div class="empty">📝 Selle lehe sisu saad lisada oma veebilehe redaktoris. Praegu on see kujunduse näidis.</div>`}<p style="margin-top:28px"><button class="back" data-go="Home">← Avaleht</button></p>`}content.querySelectorAll('[data-go]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.go)));window.scrollTo(0,0)}
document.getElementById('toggle').onclick=()=>sidebar.classList.toggle('open');show('Home');
</script><script src="./butcher-noir.js?v=20261106-motion-02"></script></body></html>
